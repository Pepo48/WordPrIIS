name: WordPrIIS quality
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  portable-containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: sudo apt-get update && sudo apt-get install -y podman
      - run: python3 scripts/quality.py
      - run: bash container/verify.sh
      - run: python3 tests/package.py
  windows-compatibility:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Windows PowerShell 5.1 portable logic
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($name in @('core','bootstrap','server-audit','bootstrap-profile-runner','cron-setup','cron-proof','cron-task-definition')) {
            & powershell.exe -NoProfile -File (Join-Path $PWD ("tests/$name.ps1"))
            if($LASTEXITCODE -ne 0){throw "Failed: $name"}
          }
      - name: Hosted PowerShell 7 portable logic
        shell: pwsh
        run: .\container\powershell-tests.ps1
